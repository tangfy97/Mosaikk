name: Mac app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: swift test --scratch-path build/spm
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app (Release and App Store configurations)
        run: |
          xcodegen generate
          for config in Release AppStore; do
            xcodebuild -project Mosaikk.xcodeproj -scheme Mosaikk -configuration $config \
              -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData.noindex \
              CODE_SIGNING_ALLOWED=NO build
          done

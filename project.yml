name: CollageAtelier
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AtelierCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AtelierCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feiyang.collageatelier.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  CollageAtelier:
    type: application
    platform: macOS
    sources:
      - path: Sources/AtelierApp
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - target: AtelierCore
    settings:
      base:
        PRODUCT_NAME: Collage Atelier
        PRODUCT_BUNDLE_IDENTIFIER: com.feiyang.collageatelier
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/CollageAtelier.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
schemes:
  CollageAtelier:
    build:
      targets:
        CollageAtelier: all
    run:
      config: Debug
    archive:
      config: AppStore

name: Mosaikk
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
# Release is the website build (Developer ID, notarized); AppStore is the Mac App Store build.
# Both run in the App Sandbox with no network entitlement.
# The Swift package next to this file builds the engine (MosaikkCore) for tests.
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Mosaikk:
    type: application
    platform: macOS
    sources:
      - path: Sources/MosaikkCore
      - path: Sources/MosaikkApp
      - path: Resources
      - path: App
        excludes:
          - Info.plist
          - Mosaikk.entitlements
    settings:
      configs:
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
      base:
        PRODUCT_NAME: Mosaikk
        PRODUCT_BUNDLE_IDENTIFIER: com.feiyangtang.Mosaikk
        # The release scripts pass the team (X933P26489) and signing identity; local builds sign ad hoc.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/Mosaikk.entitlements
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mosaikk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 TangSpark. Apache License 2.0."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Mosaikk:
    build:
      targets:
        Mosaikk: all
    run:
      config: Debug
    archive:
      config: AppStore
